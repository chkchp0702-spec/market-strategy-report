name: alt-data
# 🧰 나라별 「시세 말고 다른 자료」 받기(src/alt_fetch.py → market/lab/alt/) + 검증(src/alt_bt.py → market/alt.json) — 수동 · 평일 아침
on:
  workflow_dispatch:
    inputs:
      only:
        description: 받을 것만(띄어쓰기)
        default: ""
  push:
    branches: [main]
    paths: [.github/workflows/alt.yml, src/alt_bt.py, src/rule_bt.py]
  schedule:
    - cron: "40 22 * * 0-4"   # KST 월~금 07:40
permissions:
  contents: write
concurrency:
  group: push-${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  alt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy requests lxml html5lib beautifulsoup4 openpyxl xlrd akshare pykrx
      - run: python src/alt_fetch.py ${{ github.event.inputs.only }}
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - run: python src/alt_bt.py
      - run: pip install -q yfinance && python src/rule_bt.py
      - name: 저장
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A market/lab/alt
          bash scripts/push.sh "alt-data $(TZ=Asia/Seoul date '+%F %H:%M')" market/lab/alt market/alt.json market/rule_bt.json market/rule_overlay.json
