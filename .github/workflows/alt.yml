name: alt-data
# 🧰 나라별 「시세 말고 다른 자료」 받기 (src/alt_fetch.py → market/lab/alt/) — 수동 · 스크립트 바뀔 때 · 매주 토요일
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/alt_fetch.py, .github/workflows/alt.yml]
  schedule:
    - cron: "10 21 * * 5"   # KST 토 06:10
permissions:
  contents: write
concurrency:
  group: push-${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  alt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy requests lxml html5lib beautifulsoup4 openpyxl xlrd akshare pykrx
      - run: python src/alt_fetch.py
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
      - name: 저장
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A market/lab/alt
          bash scripts/push.sh "alt-data $(TZ=Asia/Seoul date '+%F %H:%M')" market/lab/alt
