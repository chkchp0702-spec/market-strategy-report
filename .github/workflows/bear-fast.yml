name: bear-fast
# ⚡ 11/12 사용자 「신호 오면 바로바로 알려주고 어플에도 바로 반영」 — 각 나라 장 마감 10분쯤 뒤에 판정만 빠르게 돌림
#   시세 묶음(px) 새로 → 닮은 장 규칙(analog_pick) 다시 → 하락장 계기판(bear.json · 바뀌면 알림)
on:
  workflow_dispatch:
  schedule:
    - cron: "50 6 * * 1-5"    # KST 15:50 한국·일본 마감 뒤
    - cron: "25 7 * * 1-5"    # KST 16:25 중국 마감 뒤
    - cron: "25 8 * * 1-5"    # KST 17:25 홍콩 마감 뒤
    - cron: "25 21 * * 1-5"   # KST 화~토 06:25 미국 마감 뒤(겨울) · 여름엔 05:30 fetch 가 먼저 봄
permissions:
  contents: write
concurrency:
  group: bear-fast
  cancel-in-progress: false
jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy requests
      - name: 시세 묶음 + 닮은 장 규칙
        continue-on-error: true
        run: python src/alt_fetch.py px && python src/analog_bt.py | grep "🔁"
      - name: 하락장 계기판 (바뀌면 알림)
        run: python -m src.bubble_bt --live || true; python -m src.bear_gate
      - name: 저장
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          bash scripts/push.sh "bear-fast $(TZ=Asia/Seoul date '+%F %H:%M')" market/bear.json market/bear_log.json market/bubble_proxy.json market/analog.json market/analog_pick.json market/lab/alt/px.csv.gz
