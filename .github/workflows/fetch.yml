name: fetch-market

# 시세·RSS 자동 수집 + 조건 발동 알림(Issue).
# - 매일 07:00 KST (22:00 UTC) : 아침 리포트용 확정치
# - 한국 장중(09~16 KST = 00~07 UTC) 매시간, 미국 장중(22:30~05 KST = 13:30~20 UTC) 매시간 : 조건 감시
on:
  schedule:
    - cron: "15 21 * * *"    # KST 06:15 (시황 8시 전 게시용)
    - cron: "0 0-7 * * 1-5"
    - cron: "30 13-20 * * 1-5"
  workflow_dispatch:
    inputs:
      wake:
        description: "피드 이어달리기가 빠진 예약을 대신 켬 (yes면 아침 전용 단계는 시간대대로)"
        default: "no"

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-market
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch market data + RSS
        run: python -m src.fetch_market
      - name: 🔥 섹터·테마 레이더 (아침 수집 때만 — 리포트 2쪽·킥 후보)
        continue-on-error: true
        run: |
          H=$(TZ=Asia/Seoul date +%H)
          if { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.wake }}" != "yes" ]; } || { [ "$H" -ge 5 ] && [ "$H" -le 8 ]; }; then pip install -q yfinance pandas && python -m src.sectors && python -m src.focus; else echo "아침이 아니라 건너뜀"; fi
      - name: 💼 포트 (시황대로 투자했다면)
        continue-on-error: true
        run: pip install -q yfinance pandas && python -m src.port && python -m src.kick_sleeve; python -m src.conc_port || true; python -m src.global_peers || true; python -m src.bets_score || true; python -m src.home || true; python -m src.nudge || true
      - name: 🐻 하락장 계기판 (11/09 · 시장별 판정·현금 권고·바닥 신호 — 바뀌면 알림 · 아침엔 과거 검증도)
        continue-on-error: true
        run: |
          pip install -q yfinance pandas
          H=$(TZ=Asia/Seoul date +%H)
          # 🌱 11/09 A11/9-1: 과거 검증(bear_bt + 바닥 신호 성적표 bear_sig_bt)을 먼저 → 판정(bear.json)이 그 성적표를 시장마다 hist 로 붙임
          if [ ! -f market/bear_bt.json ] || [ ! -f market/bear_sig_bt.json ] || { [ "$H" -ge 5 ] && [ "$H" -le 8 ]; }; then python -m src.bear_gate --bt || true; fi
          # 🕰 11/11 대리 버블 시계(기계 칸만) → 코스피 현금 규칙 KC 가 읽음 (bubble_bt --live → market/bubble_proxy.json)
          pip install -q numpy; python -m src.bubble_bt --live || true
          python -m src.bear_gate
      - name: 🫧 버블 경보판 (11/10 · 전병서 11/11 경보표 — 신용·금리·유가·속살·순환/현금 도피 자동 + 손 칸 brain/bubble_manual.json)
        continue-on-error: true
        run: pip install -q yfinance pandas && python -m src.bubble_gate
      - name: 🌃 한국 종가→다음 시가 그림자 기록 (저녁 수집 때만, 10/22)
        continue-on-error: true
        run: |
          H=$(TZ=Asia/Seoul date +%H)
          if [ "$H" -ge 16 ] && [ "$H" -le 23 ]; then pip install -q yfinance pandas numpy && python -m src.kr_overnight; else echo "저녁이 아니라 건너뜀"; fi
      - name: Check conditions → Issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m src.alerts --issue
      - name: Commit
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          bash scripts/push.sh "fetch: $(TZ=Asia/Seoul date '+%m/%d %H:%M') KST" market feeds alerts
      - name: 🧾 선제 아이디어 채점 옮기기 (10/29 · 최신 state.json 위에서 · 두뇌가 안 옮겨도 매시간 반영)
        continue-on-error: true
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python -m src.bets_apply || break
            git add brain/state.json
            if git diff --cached --quiet; then echo "바뀐 것 없음"; break; fi
            git commit -q -m "bets_apply: $(TZ=Asia/Seoul date '+%m/%d %H:%M') KST"
            if git push -q origin HEAD:main; then echo "옮김"; break; fi
            sleep $((i * 6))
          done
