name: rules-bt
# 🧪 포트 규칙 검증 (src/rules_bt.py) — 수동 + 매주 일요일 아침
on:
  workflow_dispatch:
  schedule:
    - cron: "20 22 * * 6"   # KST 일 07:20
permissions:
  contents: write
concurrency:
  group: push-${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas numpy
      - run: python src/rules_bt.py
      - name: 저장
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          bash scripts/push.sh "rules-bt $(TZ=Asia/Seoul date '+%F %H:%M')" market/rules_bt.json
