name: tmp-txn-fmv
on:
  push:
    branches: [tmp/txn-fmv]
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q yfinance pandas
      - name: fetch
        run: |
          python - <<'P'
          import yfinance as yf, json
          dates=["2019-01-31","2020-01-31","2021-02-01","2022-01-31","2023-01-31","2024-01-31","2025-01-31","2026-01-13","2026-01-30","2026-05-20"]
          df=yf.download("TXN",start="2019-01-01",end="2026-11-17",auto_adjust=False,actions=False,progress=False)
          df.columns=[c[0] if isinstance(c,tuple) else c for c in df.columns]
          out={"rows":{},"last":None,"series":[]}
          for d in dates:
              r=df.loc[d] if d in df.index.strftime("%Y-%m-%d") else None
              if r is None: out["rows"][d]=None; continue
              out["rows"][d]={k:round(float(r[k]),4) for k in ["Open","High","Low","Close","Adj Close"]}
          m=df["Close"].resample("W-FRI").last().dropna()
          out["series"]=[[i.strftime("%Y-%m-%d"),round(float(v),2)] for i,v in m.items()]
          out["last"]=[df.index[-1].strftime("%Y-%m-%d"),round(float(df["Close"].iloc[-1]),2)]
          json.dump(out,open("txn_fmv.json","w"),indent=1)
          print(json.dumps(out["rows"],indent=1)); print(out["last"])
          P
      - uses: actions/upload-artifact@v4
        with: {name: txn_fmv, path: txn_fmv.json}
