name: probe-sources
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python src/_probe.py
      - run: |
          git config user.name report-bot; git config user.email report-bot@users.noreply.github.com
          git add market/_probe.json; git commit -m "probe" || true; git pull --rebase origin main || true; git push
