name: data-pull
# 🧰 시세 받기 도구 — 수동 실행만. 결과는 main 에 커밋하지 않고 덮어쓰는 datapull 브랜치(커밋 1개)로
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "쉼표로 구분한 야후 티커"
        required: true
      start:
        description: "시작일 YYYY-MM-DD"
        required: true
        default: "2000-01-01"
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q yfinance pandas
      - run: python tools/data_pull.py "${{ github.event.inputs.tickers }}" "${{ github.event.inputs.start }}" out
      - name: datapull 브랜치에 덮어쓰기
        run: |
          cd out
          git init -q -b datapull
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -qm "data-pull $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datapull
