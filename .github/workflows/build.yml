name: build-report

# data/YYYY-MM-DD.json 을 push 하면 PDF 2개 + 카톡 텍스트를 만들어 reports/ 에 커밋하고,
# 장부(ledger/ledger.json)에 그날 줄을 반영한다.
on:
  push:
    paths:
      - "data/*.json"
      - "templates/**"
      - "src/**"
  workflow_dispatch:
    inputs:
      day:
        description: "data 파일 (예: data/2026-10-06.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: push-${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Pick data file
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.day }}" ]; then
            echo "day=${{ github.event.inputs.day }}" >> $GITHUB_OUTPUT
          else
            echo "day=$(ls data/20*.json | sort | tail -1)" >> $GITHUB_OUTPUT
          fi
      - name: Build + commit ledger
        # 10/22 자가 업그레이드: 아침 리포트 세션이 PDF·장부를 직접 만들어 올린 날은 다시 만들지 않는다
        # (CI 글꼴 차이로 1쪽 여유 29px<40 → 그날 src 를 고치는 push 마다 빌드 실패 4번, 건강검진 빨간불)
        run: |
          DAY="${{ steps.pick.outputs.day }}"
          if python - "$DAY" <<'PY'
          import json, sys, pathlib
          d = json.load(open(sys.argv[1], encoding="utf-8"))
          led = json.load(open("ledger/ledger.json", encoding="utf-8"))
          tag = f'{d["date"]}_{d["edition"]}'
          have = list(pathlib.Path("reports", tag).glob("Market_Strategy_Report_*.pdf"))
          sys.exit(0 if d["date"] in led.get("_applied", []) and have else 1)
          PY
          then
            echo "이미 반영된 날($DAY)·PDF 있음 → 리포트는 다시 만들지 않고 대시보드만"
          else
            python -m src.build_report "$DAY" --commit
          fi
      - name: Dashboard
        run: python -m src.build_dashboard
      - name: Commit outputs
        run: |
          git config user.name "report-bot"
          git config user.email "report-bot@users.noreply.github.com"
          bash scripts/push.sh "build: $(basename ${{ steps.pick.outputs.day }} .json)" reports ledger docs
      - uses: actions/upload-artifact@v4
        with:
          name: report-pdfs
          path: reports/**/*.pdf
